<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <title>TrackGeek » Offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
        background: #09090b;
        color: #fafafa;
        font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
      }

      img {
        width: 96px;
        height: 96px;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
      }

      p {
        margin: 0;
        max-width: 32rem;
        color: #a1a1aa;
        line-height: 1.6;
      }

      button {
        cursor: pointer;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #022c22;
        background: #10b981;
        transition: background 150ms ease;
      }

      button:hover {
        background: #059669;
      }
    </style>
  </head>

  <body>
    <img src="/icons/icon-192.png" alt="TrackGeek" />

    <h1>You're offline</h1>

    <p>TrackGeek needs a connection to load this page. Check your network and try again — pages you already visited stay available.</p>

    <button type="button" onclick="location.reload()">Try again</button>

    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
